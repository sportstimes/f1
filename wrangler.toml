name = "calendar-worker"
main = "workers-site/index.js"
workers_dev = true
site = {bucket = "./static"}
compatibility_date = "2026-07-01"

[cache]
enabled = true

[env.production]
name = "calendar-worker-production"
route = "files.motorsportcalendars.com/*"

[env.f1]
name = "files-f1"
route = "files-f1.motorsportcalendars.com/*"

[env.f2]
name = "files-f2"
route = "files-f2.motorsportcalendars.com/*"

[env.f3]
name = "files-f3"
route = "files-f3.motorsportcalendars.com/*"

[env.fe]
name = "files-fe"
route = "files-fe.motorsportcalendars.com/*"

[env.indycar]
name = "files-indycar"
route = "files-indycar.motorsportcalendars.com/*"

[env.motogp]
name = "files-motogp"
route = "files-motogp.motorsportcalendars.com/*"

[env.f1-academy]
name = "files-f1-academy"
route = "files-f1-academy.motorsportcalendars.com/*"